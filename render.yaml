# Render Blueprint - deploy at https://dashboard.render.com/blueprints
databases:
  - name: sat-db
    databaseName: sat_shop
    user: sat_user
    plan: free

services:
  - type: web
    name: sri-anjaneya-traders
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: 3.12.0
