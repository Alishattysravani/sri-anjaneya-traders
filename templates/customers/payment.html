{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}
{% block content %}
<h2>Record Payment - {{ customer.name }}</h2>
<p>Current Balance: <strong>₹{{ "%.2f"|format(customer.balance) }}</strong></p>
<div class="card shadow-sm mt-3"><div class="card-body">
<form method="POST">
    <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Amount *</label><input type="number" step="0.01" min="0.01" name="amount" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" value="{{ today if today else '' }}" required></div>
        <div class="col-md-4"><label class="form-label">Payment Mode</label>
            <select name="payment_mode" class="form-select"><option>Cash</option><option>UPI</option><option>Credit</option></select>
        </div>
        <div class="col-md-6"><label class="form-label">Reference</label><input type="text" name="reference" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Notes</label><input type="text" name="notes" class="form-control"></div>
    </div>
    <div class="mt-3"><button type="submit" class="btn btn-success">Save Payment</button><a href="{{ url_for('customers.view', id=customer.id) }}" class="btn btn-secondary">Cancel</a></div>
</form>
</div></div>
{% endblock %}
{% block scripts %}
<script>document.querySelector('[name=date]').value = new Date().toISOString().split('T')[0];</script>
{% endblock %}
