{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Customers</h2>
    <div>
        <a href="{{ url_for('customers.export') }}" class="btn btn-outline-success btn-sm"><i class="bi bi-file-earmark-excel"></i> Export</a>
        <a href="{{ url_for('customers.add') }}" class="btn btn-success btn-sm"><i class="bi bi-plus"></i> Add Customer</a>
    </div>
</div>
<form class="row g-2 mb-3" method="GET">
    <div class="col-md-4"><input type="text" name="search" class="form-control" placeholder="Search..." value="{{ search }}"></div>
    <div class="col-auto"><button class="btn btn-primary">Search</button></div>
</form>
<div class="card shadow-sm">
    <table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Name</th><th>Phone</th><th>Balance</th><th>Actions</th></tr></thead>
        <tbody>
        {% for c in customers %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.phone or '-' }}</td>
            <td>₹{{ "%.2f"|format(c.balance) }}</td>
            <td>
                <a href="{{ url_for('customers.view', id=c.id) }}" class="btn btn-sm btn-outline-info"><i class="bi bi-eye"></i></a>
                <a href="{{ url_for('customers.edit', id=c.id) }}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                <form method="POST" action="{{ url_for('customers.delete', id=c.id) }}" class="d-inline" onsubmit="return confirm('Delete?')">
                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-muted">No customers.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
