{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}

<h2>Shop Settings</h2>

<div class="card shadow-sm mt-3">
    <div class="card-body">

        <form method="POST">

            <div class="row g-3">

                <!-- SHOP DETAILS -->

                <div class="col-md-6">
                    <label class="form-label">Shop Name</label>
                    <input type="text"
                           name="shop_name"
                           class="form-control"
                           value="{{ settings.shop_name }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ settings.phone or '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ settings.email or '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">GST Number</label>
                    <input type="text"
                           name="gst_number"
                           class="form-control"
                           value="{{ settings.gst_number or '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Invoice Prefix</label>
                    <input type="text"
                           name="invoice_prefix"
                           class="form-control"
                           value="{{ settings.invoice_prefix }}">
                </div>

                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea name="address"
                              class="form-control"
                              rows="3">{{ settings.address or '' }}</textarea>
                </div>

            </div>

            <div class="mt-3">

                <button type="submit"
                        class="btn btn-success">

                    Save Settings

                </button>

            </div>

        </form>

    </div>
</div>

{% endblock %}
