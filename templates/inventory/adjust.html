{% extends "base.html" %}
{% block title %}Stock Adjustment{% endblock %}
{% block content %}
<h2>Stock Adjustment</h2>
<div class="card shadow-sm mt-3"><div class="card-body">
<form method="POST">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Product *</label>
            <select name="product_id" class="form-select" required>
                <option value="">Select Product</option>
                {% for p in products %}<option value="{{ p.id }}">{{ p.name }} (Stock: {{ p.stock }})</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Adjustment Type *</label>
            <select name="adjustment_type" class="form-select" required>
                <option value="increase">Increase</option>
                <option value="decrease">Decrease</option>
            </select>
        </div>
        <div class="col-md-3"><label class="form-label">Quantity *</label><input type="number" step="0.01" min="0.01" name="quantity" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
        <div class="col-md-9"><label class="form-label">Reason</label><input type="text" name="reason" class="form-control" placeholder="e.g. Damaged bags"></div>
    </div>
    <div class="mt-3"><button type="submit" class="btn btn-warning">Adjust Stock</button><a href="{{ url_for('inventory.index') }}" class="btn btn-secondary">Cancel</a></div>
</form>
</div></div>
{% endblock %}
{% block scripts %}
<script>document.querySelector('[name=date]').value = new Date().toISOString().split('T')[0];</script>
{% endblock %}
