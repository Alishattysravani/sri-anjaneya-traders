{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}
{% block content %}
<h2>{{ 'Edit' if product else 'Add' }} Product</h2>
<div class="card shadow-sm mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Product Name *</label>
                    <input type="text" name="name" class="form-control" required value="{{ product.name if product else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Category *</label>
                    <select name="category_id" class="form-select" required>
                        <option value="">Select</option>
                        {% for c in categories %}
                        <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Brand</label>
                    <select name="brand_id" class="form-select">
                        <option value="">None</option>
                        {% for b in brands %}
                        <option value="{{ b.id }}" {% if product and product.brand_id == b.id %}selected{% endif %}>{{ b.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Unit *</label>
                    <select name="unit_id" class="form-select" required>
                        <option value="">Select</option>
                        {% for u in units %}
                        <option value="{{ u.id }}" {% if product and product.unit_id == u.id %}selected{% endif %}>{{ u.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Batch Number</label>
                    <input type="text" name="batch_number" class="form-control" value="{{ product.batch_number if product else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Purchase Price</label>
                    <input type="number" step="0.01" min="0" name="purchase_price" class="form-control" value="{{ product.purchase_price if product else 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Selling Price</label>
                    <input type="number" step="0.01" min="0" name="selling_price" class="form-control" value="{{ product.selling_price if product else 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Stock</label>
                    <input type="number" step="0.01" min="0" name="stock" class="form-control" value="{{ product.stock if product else 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Minimum Stock</label>
                    <input type="number" step="0.01" min="0" name="minimum_stock" class="form-control" value="{{ product.minimum_stock if product else 0 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Expiry Date</label>
                    <input type="date" name="expiry_date" class="form-control" value="{{ product.expiry_date if product and product.expiry_date else '' }}">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Save</button>
                <a href="{{ url_for('products.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
