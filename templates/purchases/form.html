{% extends "base.html" %}
{% block title %}New Purchase{% endblock %}
{% block content %}
<h2>New Purchase</h2>
<div class="card shadow-sm mt-3"><div class="card-body">
<form method="POST" id="purchaseForm">
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label">Supplier *</label>
            <select name="supplier_id" class="form-select" required>
                <option value="">Select Supplier</option>
                {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Invoice/Reference</label><input type="text" name="invoice_number" class="form-control"></div>
    </div>

    <h5>Items</h5>
    <div id="itemRows">
        <div class="row g-2 mb-2 item-row align-items-end">
            <div class="col-md-4">
                <label class="form-label">Product</label>
                <select name="product_id[]" class="form-select item-product" required>
                    <option value="">Select</option>
                    {% for p in products %}
                    <option value="{{ p.id }}" data-price="{{ p.purchase_price }}">{{ p.name }} (Stock: {{ p.stock }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2"><label class="form-label">Qty</label><input type="number" step="0.01" min="0.01" name="quantity[]" class="form-control item-qty" required></div>
            <div class="col-md-2"><label class="form-label">Price</label><input type="number" step="0.01" min="0" name="price[]" class="form-control item-price" required></div>
            <div class="col-md-2"><label class="form-label">Total</label><div class="form-control-plaintext item-total">0.00</div></div>
            <div class="col-md-2"><button type="button" class="btn btn-outline-danger remove-row" disabled><i class="bi bi-trash"></i></button></div>
        </div>
    </div>
    <button type="button" class="btn btn-outline-primary btn-sm mb-3" onclick="addPurchaseRow()"><i class="bi bi-plus"></i> Add Item</button>

    <div class="row g-3">
        <div class="col-md-3"><label class="form-label">Subtotal</label><div class="form-control-plaintext" id="subtotal">0.00</div></div>
        <div class="col-md-3"><label class="form-label">Paid Amount</label><input type="number" step="0.01" min="0" name="paid_amount" id="paid_amount" class="form-control" value="0"></div>
        <div class="col-md-3"><label class="form-label">Balance</label><div class="form-control-plaintext" id="balance">0.00</div></div>
    </div>
    <div class="mt-3"><button type="submit" class="btn btn-success">Save Purchase</button><a href="{{ url_for('purchases.index') }}" class="btn btn-secondary">Cancel</a></div>
</form>
</div></div>

<template id="purchaseRowTemplate">
    <div class="row g-2 mb-2 item-row align-items-end">
        <div class="col-md-4">
            <select name="product_id[]" class="form-select item-product" required>
                <option value="">Select</option>
                {% for p in products %}
                <option value="{{ p.id }}" data-price="{{ p.purchase_price }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2"><input type="number" step="0.01" min="0.01" name="quantity[]" class="form-control item-qty" required></div>
        <div class="col-md-2"><input type="number" step="0.01" min="0" name="price[]" class="form-control item-price" required></div>
        <div class="col-md-2"><div class="form-control-plaintext item-total">0.00</div></div>
        <div class="col-md-2"><button type="button" class="btn btn-outline-danger remove-row"><i class="bi bi-trash"></i></button></div>
    </div>
</template>
{% endblock %}
{% block scripts %}
<script>
document.querySelector('[name=date]').value = new Date().toISOString().split('T')[0];
document.querySelectorAll('.item-row').forEach(attachRowEvents);
document.getElementById('paid_amount').addEventListener('input', updatePurchaseTotals);
function updatePurchaseTotals() {
    let subtotal = 0;
    document.querySelectorAll('.item-row').forEach(function(row) {
        const qty = parseFloat(row.querySelector('.item-qty')?.value) || 0;
        const price = parseFloat(row.querySelector('.item-price')?.value) || 0;
        subtotal += qty * price;
    });
    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
    const paid = parseFloat(document.getElementById('paid_amount').value) || 0;
    document.getElementById('balance').textContent = (subtotal - paid).toFixed(2);
}
function addPurchaseRow() {
    const tpl = document.getElementById('purchaseRowTemplate');
    const clone = tpl.content.cloneNode(true);
    document.getElementById('itemRows').appendChild(clone);
    attachRowEvents(document.getElementById('itemRows').lastElementChild);
    document.getElementById('itemRows').querySelectorAll('.remove-row').forEach(function(btn) { btn.disabled = false; });
}
const origUpdate = updateGrandTotal;
document.querySelectorAll('.item-qty, .item-price').forEach(function(el) {
    el.addEventListener('input', updatePurchaseTotals);
});
</script>
{% endblock %}
