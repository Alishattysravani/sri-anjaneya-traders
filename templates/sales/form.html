{% extends "base.html" %}

{% block title %}Sales / Billing{% endblock %}

{% block content %}

<h2>Sales / Billing</h2>

<div class="card shadow-sm mt-3">
    <div class="card-body">

        <form method="POST"
              action="{{ url_for('sales.create') }}"
              id="salesForm">

            <!-- ================= CUSTOMER / BILL DETAILS ================= -->

            <div class="row g-3 mb-3">

                <div class="col-md-4">
                    <label class="form-label">
                        Customer *
                    </label>

                    <select name="customer_id"
                            id="customer_id"
                            class="form-select"
                            required>

                        <option value="">
                            Select Customer
                        </option>

                        {% for c in customers %}

                        <option value="{{ c.id }}"
                                data-phone="{{ c.phone or '' }}"
                                data-village="{{ c.village or '' }}"
                                data-address="{{ c.address or '' }}">

                            {{ c.name }}

                        </option>

                        {% endfor %}

                    </select>
                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Date
                    </label>

                    <input type="date"
                           name="date"
                           id="bill_date"
                           class="form-control"
                           required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Payment Mode
                    </label>

                    <select name="payment_mode"
                            class="form-select">

                        {% for mode in payment_modes %}

                        <option value="{{ mode }}">
                            {{ mode }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <!-- ================= CUSTOMER INFORMATION ================= -->

            <div id="customerInfo"
                 class="border rounded p-3 mb-4 bg-light"
                 style="display:none;">

                <h6 class="mb-3">
                    Customer / Farmer Details
                </h6>

                <div class="row g-3">

                    <div class="col-md-4">

                        <strong>Name:</strong>

                        <span id="customerName">
                        </span>

                    </div>


                    <div class="col-md-4">

                        <strong>Phone:</strong>

                        <span id="customerPhone">
                        </span>

                    </div>




                    <div class="col-md-12">

                        <strong>Address:</strong>

                        <span id="customerAddress">
                        </span>

                    </div>

                </div>

            </div>


            <!-- ================= ITEMS ================= -->

            <h5 class="mb-3">
                Items
            </h5>


            <div id="itemRows">

                <!-- FIRST ITEM -->

                <div class="row g-2 mb-3 item-row align-items-end">

                    <!-- PRODUCT -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Product
                        </label>

                        <select name="product_id[]"
                                class="form-select item-product"
                                required>

                            <option value="">
                                Select Product
                            </option>

                            {% for p in products %}

                            <option value="{{ p.id }}"
                                    data-price="{{ p.selling_price or 0 }}"
                                    data-stock="{{ p.stock or 0 }}"
                                    data-hsn="{{ p.hsn_code or '' }}"
                                    data-batch="{{ p.batch_number or '' }}"
                                    data-mfg="{{ p.manufacturing_date.strftime('%m/%Y') if p.manufacturing_date else '' }}"
                                    data-exp="{{ p.expiry_date.strftime('%m/%Y') if p.expiry_date else '' }}"
                                    data-packing="{{ p.packing or '' }}"
                                    data-gst="{{ p.gst_percent or 0 }}"
                                    data-unit="{{ p.unit.name if p.unit else '' }}"
                                    data-brand="{{ p.brand.name if p.brand else '' }}">

                                {{ p.name }} (Stock: {{ p.stock }})

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- QTY -->

                    <div class="col-md-2">

                        <label class="form-label">
                            Qty
                        </label>

                        <input type="number"
                               step="0.01"
                               min="0.01"
                               name="quantity[]"
                               class="form-control item-qty"
                               placeholder="Qty"
                               required>

                    </div>


                    <!-- RATE -->

                    <div class="col-md-2">

                        <label class="form-label">
                            Rate
                        </label>

                        <input type="number"
                               step="0.01"
                               min="0"
                               name="price[]"
                               class="form-control item-price"
                               placeholder="Rate"
                               required>

                    </div>


                    <!-- TOTAL -->

                    <div class="col-md-2">

                        <label class="form-label">
                            Total
                        </label>

                        <div class="form-control-plaintext item-total fw-bold">
                            ₹0.00
                        </div>

                    </div>


                    <!-- REMOVE -->

                    <div class="col-md-2">

                        <button type="button"
                                class="btn btn-outline-danger remove-row"
                                disabled>

                            <i class="bi bi-trash"></i>

                        </button>

                    </div>


                    <!-- PRODUCT INFORMATION -->

                    <div class="col-md-12 product-info"
                         style="display:none;">

                        <div class="border rounded p-2 bg-light">

                            <div class="row g-2 small">

                                <div class="col-md-2">

                                    <strong>HSN:</strong>

                                    <span class="product-hsn">
                                    </span>

                                </div>


                                <div class="col-md-2">

                                    <strong>Lot No:</strong>

                                    <span class="product-batch">
                                    </span>

                                </div>


                                <div class="col-md-2">

                                    <strong>Mfg. Dt:</strong>

                                    <span class="product-mfg">
                                    </span>

                                </div>


                                <div class="col-md-2">

                                    <strong>Exp. Dt:</strong>

                                    <span class="product-exp">
                                    </span>

                                </div>


                                <div class="col-md-2">

                                    <strong>Packing:</strong>

                                    <span class="product-packing">
                                    </span>

                                </div>


                                <div class="col-md-2">

                                    <strong>GST:</strong>

                                    <span class="product-gst">
                                    </span>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ================= ADD ITEM ================= -->

            <button type="button"
                    class="btn btn-outline-primary btn-sm mb-4"
                    id="addItemBtn">

                <i class="bi bi-plus"></i>
                Add Item

            </button>


            <!-- ================= TOTALS ================= -->

            <div class="row g-3">


                <!-- SUBTOTAL -->

                <div class="col-md-2">

                    <label class="form-label">
                        Subtotal
                    </label>

                    <div id="subtotal"
                         class="form-control-plaintext fw-bold">

                        ₹0.00

                    </div>

                </div>


                <!-- DISCOUNT -->

                <div class="col-md-2">

                    <label class="form-label">
                        Discount
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           name="discount"
                           id="discount"
                           class="form-control"
                           value="0">

                </div>


                <!-- GST -->

                <div class="col-md-2">

                    <label class="form-label">
                        GST
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           name="gst"
                           id="gst"
                           class="form-control"
                           value="0">

                </div>


                <!-- GRAND TOTAL -->

                <div class="col-md-2">

                    <label class="form-label">
                        Grand Total
                    </label>

                    <div id="grand_total"
                         class="form-control-plaintext fw-bold text-success">

                        ₹0.00

                    </div>

                </div>


                <!-- PAID -->

                <div class="col-md-2">

                    <label class="form-label">
                        Paid Amount
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           name="paid_amount"
                           id="paid_amount"
                           class="form-control"
                           value="0">

                </div>


                <!-- BALANCE -->

                <div class="col-md-2">

                    <label class="form-label">
                        Balance
                    </label>

                    <div id="balance"
                         class="form-control-plaintext fw-bold text-danger">

                        ₹0.00

                    </div>

                </div>

            </div>


            <!-- ================= CREATE BILL ================= -->

            <div class="mt-4">

                <button type="submit"
                        class="btn btn-success btn-lg">

                    <i class="bi bi-receipt"></i>
                    Create Bill

                </button>

            </div>

        </form>

    </div>
</div>


<!-- ========================================================= -->
<!-- ADDITIONAL ITEM TEMPLATE                                  -->
<!-- ========================================================= -->

<template id="salesRowTemplate">

    <div class="row g-2 mb-3 item-row align-items-end">


        <!-- PRODUCT -->

        <div class="col-md-4">

            <label class="form-label">
                Product
            </label>

            <select name="product_id[]"
                    class="form-select item-product"
                    required>

                <option value="">
                    Select Product
                </option>

                {% for p in products %}

                <option value="{{ p.id }}"
                        data-price="{{ p.selling_price or 0 }}"
                        data-stock="{{ p.stock or 0 }}"
                        data-hsn="{{ p.hsn_code or '' }}"
                        data-batch="{{ p.batch_number or '' }}"
                        data-mfg="{{ p.manufacturing_date.strftime('%m/%Y') if p.manufacturing_date else '' }}"
                        data-exp="{{ p.expiry_date.strftime('%m/%Y') if p.expiry_date else '' }}"
                        data-packing="{{ p.packing or '' }}"
                        data-gst="{{ p.gst_percent or 0 }}"
                        data-unit="{{ p.unit.name if p.unit else '' }}"
                        data-brand="{{ p.brand.name if p.brand else '' }}">

                    {{ p.name }} (Stock: {{ p.stock }})

                </option>

                {% endfor %}

            </select>

        </div>


        <!-- QTY -->

        <div class="col-md-2">

            <label class="form-label">
                Qty
            </label>

            <input type="number"
                   step="0.01"
                   min="0.01"
                   name="quantity[]"
                   class="form-control item-qty"
                   placeholder="Qty"
                   required>

        </div>


        <!-- RATE -->

        <div class="col-md-2">

            <label class="form-label">
                Rate
            </label>

            <input type="number"
                   step="0.01"
                   min="0"
                   name="price[]"
                   class="form-control item-price"
                   placeholder="Rate"
                   required>

        </div>


        <!-- TOTAL -->

        <div class="col-md-2">

            <label class="form-label">
                Total
            </label>

            <div class="form-control-plaintext item-total fw-bold">
                ₹0.00
            </div>

        </div>


        <!-- REMOVE -->

        <div class="col-md-2">

            <button type="button"
                    class="btn btn-outline-danger remove-row">

                <i class="bi bi-trash"></i>

            </button>

        </div>


        <!-- PRODUCT DETAILS -->

        <div class="col-md-12 product-info"
             style="display:none;">

            <div class="border rounded p-2 bg-light">

                <div class="row g-2 small">

                    <div class="col-md-2">
                        <strong>HSN:</strong>
                        <span class="product-hsn"></span>
                    </div>

                    <div class="col-md-2">
                        <strong>Lot No:</strong>
                        <span class="product-batch"></span>
                    </div>

                    <div class="col-md-2">
                        <strong>Mfg. Dt:</strong>
                        <span class="product-mfg"></span>
                    </div>

                    <div class="col-md-2">
                        <strong>Exp. Dt:</strong>
                        <span class="product-exp"></span>
                    </div>

                    <div class="col-md-2">
                        <strong>Packing:</strong>
                        <span class="product-packing"></span>
                    </div>

                    <div class="col-md-2">
                        <strong>GST:</strong>
                        <span class="product-gst"></span>
                    </div>

                </div>

            </div>

        </div>

    </div>

</template>

{% endblock %}


{% block scripts %}

<script>

document.addEventListener("DOMContentLoaded", function () {

    const salesForm = document.getElementById("salesForm");
    const itemRows = document.getElementById("itemRows");
    const template = document.getElementById("salesRowTemplate");

    const subtotalElement = document.getElementById("subtotal");
    const grandTotalElement = document.getElementById("grand_total");
    const balanceElement = document.getElementById("balance");

    const discountInput = document.getElementById("discount");
    const gstInput = document.getElementById("gst");
    const paidInput = document.getElementById("paid_amount");

    const customerSelect = document.getElementById("customer_id");



    /* =========================================================
       SET TODAY'S DATE
       ========================================================= */

    const dateInput = document.getElementById("bill_date");

    if (dateInput && !dateInput.value) {

        const today = new Date();

        const year = today.getFullYear();

        const month = String(today.getMonth() + 1).padStart(2, "0");

        const day = String(today.getDate()).padStart(2, "0");

        dateInput.value = `${year}-${month}-${day}`;

    }



    /* =========================================================
       FORMAT CURRENCY
       ========================================================= */

    function formatCurrency(value) {

        const number = Number(value) || 0;

        return "₹" + number.toFixed(2);

    }



    /* =========================================================
       GET NUMBER
       ========================================================= */

    function getNumber(value) {

        const number = parseFloat(value);

        return Number.isFinite(number) ? number : 0;

    }



    /* =========================================================
       CALCULATE SINGLE ITEM
       ========================================================= */

    function calculateItem(row) {

        const qtyInput = row.querySelector(".item-qty");

        const priceInput = row.querySelector(".item-price");

        const totalElement = row.querySelector(".item-total");

        const qty = getNumber(qtyInput.value);

        const price = getNumber(priceInput.value);

        const total = qty * price;

        totalElement.textContent = formatCurrency(total);

        return total;

    }



    /* =========================================================
       CALCULATE ALL TOTALS
       ========================================================= */

    function calculateTotals() {

        let subtotal = 0;

        document.querySelectorAll(".item-row").forEach(function (row) {

            subtotal += calculateItem(row);

        });


        const discount = Math.max(
            0,
            getNumber(discountInput.value)
        );


        /*
         * GST is calculated automatically from
         * the selected products' GST percentages.
         */

        let calculatedGST = 0;

        document.querySelectorAll(".item-row").forEach(function (row) {

            const product = row.querySelector(".item-product");

            const selectedOption =
                product.options[product.selectedIndex];

            if (!selectedOption || !selectedOption.value) {
                return;
            }

            const gstPercent =
                getNumber(selectedOption.dataset.gst);

            const qty =
                getNumber(row.querySelector(".item-qty").value);

            const price =
                getNumber(row.querySelector(".item-price").value);

            const itemAmount = qty * price;

            /*
             * GST is calculated after discount.
             * Discount is applied proportionally.
             */

            const taxableAmount = Math.max(
                0,
                itemAmount
            );

            calculatedGST +=
                taxableAmount * gstPercent / 100;

        });


        /*
         * If GST is automatically calculated,
         * put the amount into the GST field.
         */

        gstInput.value = calculatedGST.toFixed(2);


        const gst = Math.max(
            0,
            getNumber(gstInput.value)
        );


        const grandTotal = Math.max(
            0,
            subtotal - discount + gst
        );


        const paidAmount = Math.max(
            0,
            getNumber(paidInput.value)
        );


        const balance = Math.max(
            0,
            grandTotal - paidAmount
        );


        subtotalElement.textContent =
            formatCurrency(subtotal);

        grandTotalElement.textContent =
            formatCurrency(grandTotal);

        balanceElement.textContent =
            formatCurrency(balance);

    }



    /* =========================================================
       PRODUCT SELECTION
       ========================================================= */

    function updateProduct(row) {

        const productSelect =
            row.querySelector(".item-product");

        const priceInput =
            row.querySelector(".item-price");

        const selectedOption =
            productSelect.options[
                productSelect.selectedIndex
            ];


        if (!selectedOption || !selectedOption.value) {

            priceInput.value = "";

            const productInfo =
                row.querySelector(".product-info");

            if (productInfo) {
                productInfo.style.display = "none";
            }

            calculateTotals();

            return;

        }


        /* ================= PRICE ================= */

        const price =
            selectedOption.dataset.price || "0";

        priceInput.value =
            parseFloat(price).toFixed(2);


        /* ================= STOCK CHECK ================= */

        const stock =
            getNumber(selectedOption.dataset.stock);


        const qtyInput =
            row.querySelector(".item-qty");


        qtyInput.setAttribute(
            "max",
            stock
        );


        /* ================= PRODUCT DETAILS ================= */

        const productInfo =
            row.querySelector(".product-info");


        if (productInfo) {

            productInfo.style.display = "block";


            const hsn =
                row.querySelector(".product-hsn");

            const batch =
                row.querySelector(".product-batch");

            const mfg =
                row.querySelector(".product-mfg");

            const exp =
                row.querySelector(".product-exp");

            const packing =
                row.querySelector(".product-packing");

            const gst =
                row.querySelector(".product-gst");


            hsn.textContent =
                selectedOption.dataset.hsn || "-";


            batch.textContent =
                selectedOption.dataset.batch || "-";


            mfg.textContent =
                selectedOption.dataset.mfg || "-";


            exp.textContent =
                selectedOption.dataset.exp || "-";


            packing.textContent =
                selectedOption.dataset.packing || "-";


            gst.textContent =
                (selectedOption.dataset.gst || "0") + "%";

        }


        calculateTotals();

    }



    /* =========================================================
       CUSTOMER SELECTION
       ========================================================= */

    function updateCustomer() {

        const selectedOption =
            customerSelect.options[
                customerSelect.selectedIndex
            ];


        const customerInfo =
            document.getElementById("customerInfo");


        if (!selectedOption || !selectedOption.value) {

            customerInfo.style.display = "none";

            return;

        }


        document.getElementById("customerName")
            .textContent =
            selectedOption.textContent.trim();


        document.getElementById("customerPhone")
            .textContent =
            selectedOption.dataset.phone || "-";


        document.getElementById("customerVillage")
            .textContent =
            selectedOption.dataset.village || "-";


        document.getElementById("customerAddress")
            .textContent =
            selectedOption.dataset.address || "-";


        customerInfo.style.display = "block";

    }



    /* =========================================================
       ADD NEW ROW
       ========================================================= */

    function addRow() {

        const clone =
            template.content.cloneNode(true);

        itemRows.appendChild(clone);

        updateRemoveButtons();

        const newRow =
            itemRows.lastElementChild;

        attachRowEvents(newRow);

        calculateTotals();

    }



    /* =========================================================
       REMOVE ROW
       ========================================================= */

    function removeRow(row) {

        const rows =
            itemRows.querySelectorAll(".item-row");


        if (rows.length <= 1) {

            return;

        }


        row.remove();

        updateRemoveButtons();

        calculateTotals();

    }



    /* =========================================================
       UPDATE REMOVE BUTTONS
       ========================================================= */

    function updateRemoveButtons() {

        const rows =
            itemRows.querySelectorAll(".item-row");


        rows.forEach(function (row, index) {

            const button =
                row.querySelector(".remove-row");


            button.disabled =
                rows.length === 1;

        });

    }



    /* =========================================================
       ATTACH EVENTS TO ITEM ROW
       ========================================================= */

    function attachRowEvents(row) {

        const productSelect =
            row.querySelector(".item-product");


        const qtyInput =
            row.querySelector(".item-qty");


        const priceInput =
            row.querySelector(".item-price");


        const removeButton =
            row.querySelector(".remove-row");


        productSelect.addEventListener(
            "change",
            function () {

                updateProduct(row);

            }
        );


        qtyInput.addEventListener(
            "input",
            function () {

                const selectedOption =
                    productSelect.options[
                        productSelect.selectedIndex
                    ];


                if (
                    selectedOption &&
                    selectedOption.value
                ) {

                    const stock =
                        getNumber(
                            selectedOption.dataset.stock
                        );


                    const qty =
                        getNumber(qtyInput.value);


                    if (stock > 0 && qty > stock) {

                        qtyInput.setCustomValidity(
                            `Only ${stock} units available in stock.`
                        );

                    } else {

                        qtyInput.setCustomValidity("");

                    }

                }


                calculateTotals();

            }
        );


        priceInput.addEventListener(
            "input",
            function () {

                calculateTotals();

            }
        );


        removeButton.addEventListener(
            "click",
            function () {

                removeRow(row);

            }
        );

    }



    /* =========================================================
       DISCOUNT CHANGE
       ========================================================= */

    discountInput.addEventListener(
        "input",
        function () {

            calculateTotals();

        }
    );



    /* =========================================================
       GST MANUAL CHANGE
       ========================================================= */

    gstInput.addEventListener(
        "input",
        function () {

            const subtotal =
                getNumber(
                    subtotalElement.textContent.replace(
                        "₹",
                        ""
                    )
                );


            const discount =
                getNumber(discountInput.value);


            const gst =
                getNumber(gstInput.value);


            const grandTotal =
                Math.max(
                    0,
                    subtotal - discount + gst
                );


            const paid =
                getNumber(paidInput.value);


            const balance =
                Math.max(
                    0,
                    grandTotal - paid
                );


            grandTotalElement.textContent =
                formatCurrency(grandTotal);


            balanceElement.textContent =
                formatCurrency(balance);

        }
    );



    /* =========================================================
       PAID AMOUNT CHANGE
       ========================================================= */

    paidInput.addEventListener(
        "input",
        function () {

            const subtotal =
                getNumber(
                    subtotalElement.textContent.replace(
                        "₹",
                        ""
                    )
                );


            const discount =
                getNumber(discountInput.value);


            const gst =
                getNumber(gstInput.value);


            const grandTotal =
                Math.max(
                    0,
                    subtotal - discount + gst
                );


            const paid =
                getNumber(paidInput.value);


            const balance =
                Math.max(
                    0,
                    grandTotal - paid
                );


            balanceElement.textContent =
                formatCurrency(balance);

        }
    );



    /* =========================================================
       ADD ITEM BUTTON
       ========================================================= */

    document.getElementById("addItemBtn")
        .addEventListener(
            "click",
            function () {

                addRow();

            }
        );



    /* =========================================================
       CUSTOMER CHANGE
       ========================================================= */

    customerSelect.addEventListener(
        "change",
        function () {

            updateCustomer();

        }
    );



    /* =========================================================
       INITIALIZE EXISTING ROW
       ========================================================= */

    document.querySelectorAll(".item-row")
        .forEach(function (row) {

            attachRowEvents(row);

        });


    updateRemoveButtons();

    calculateTotals();

});

</script>

{% endblock %}
