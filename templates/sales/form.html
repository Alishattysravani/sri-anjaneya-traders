{% extends "base.html" %}
{% block title %}Sales / Billing{% endblock %}
{% block content %}
<h2>Sales / Billing</h2>
<div class="card shadow-sm mt-3"><div class="card-body">
<form method="POST" action="{{ url_for('sales.create') }}" id="salesForm">
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label">Customer *</label>
            <select name="customer_id" class="form-select" required>
                <option value="">Select Customer</option>
                {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Payment Mode</label>
            <select name="payment_mode" class="form-select">
                {% for mode in payment_modes %}<option>{{ mode }}</option>{% endfor %}
            </select>
        </div>
    </div>

    <h5>Items</h5>
    <div id="itemRows">
        <div class="row g-2 mb-2 item-row align-items-end">
            <div class="col-md-4">
                <label class="form-label">Product</label>
                <select name="product_id[]" class="form-select item-product" required>
                    <option value="">Select</option>
                    {% for p in products %}
                    <option value="{{ p.id }}" data-price="{{ p.selling_price }}" data-stock="{{ p.stock }}">{{ p.name }} (Stock: {{ p.stock }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2"><label class="form-label">Qty</label><input type="number" step="0.01" min="0.01" name="quantity[]" class="form-control item-qty" required></div>
            <div class="col-md-2"><label class="form-label">Rate</label><input type="number" step="0.01" min="0" name="price[]" class="form-control item-price" required></div>
            <div class="col-md-2"><label class="form-label">Total</label><div class="form-control-plaintext item-total">0.00</div></div>
            <div class="col-md-2"><button type="button" class="btn btn-outline-danger remove-row" disabled><i class="bi bi-trash"></i></button></div>
        </div>
    </div>
    <button type="button" class="btn btn-outline-primary btn-sm mb-3" onclick="addRow('itemRows', 'salesRowTemplate')"><i class="bi bi-plus"></i> Add Item</button>

    <div class="row g-3">
        <div class="col-md-2"><label class="form-label">Subtotal</label><div id="subtotal" class="form-control-plaintext fw-bold">0.00</div></div>
        <div class="col-md-2"><label class="form-label">Discount</label><input type="number" step="0.01" min="0" name="discount" id="discount" class="form-control" value="0"></div>
        <div class="col-md-2"><label class="form-label">GST</label><input type="number" step="0.01" min="0" name="gst" id="gst" class="form-control" value="0"></div>
        <div class="col-md-2"><label class="form-label">Grand Total</label><div id="grand_total" class="form-control-plaintext fw-bold text-success">0.00</div></div>
        <div class="col-md-2"><label class="form-label">Paid Amount</label><input type="number" step="0.01" min="0" name="paid_amount" id="paid_amount" class="form-control" value="0"></div>
        <div class="col-md-2"><label class="form-label">Balance</label><div id="balance" class="form-control-plaintext fw-bold text-danger">0.00</div></div>
    </div>
    <div class="mt-3"><button type="submit" class="btn btn-success btn-lg"><i class="bi bi-receipt"></i> Create Bill</button></div>
</form>
</div></div>

<template id="salesRowTemplate">
    <div class="row g-2 mb-2 item-row align-items-end">
        <div class="col-md-4">
            <select name="product_id[]" class="form-select item-product" required>
                <option value="">Select</option>
                {% for p in products %}
                <option value="{{ p.id }}" data-price="{{ p.selling_price }}" data-stock="{{ p.stock }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2"><input type="number" step="0.01" min="0.01" name="quantity[]" class="form-control item-qty" required></div>
        <div class="col-md-2"><input type="number" step="0.01" min="0" name="price[]" class="form-control item-price" required></div>
        <div class="col-md-2"><div class="form-control-plaintext item-total">0.00</div></div>
        <div class="col-md-2"><button type="button" class="btn btn-outline-danger remove-row"><i class="bi bi-trash"></i></button></div>
    </div>
</template>
{% endblock %}
{% block scripts %}
<script>document.querySelector('[name=date]').value = new Date().toISOString().split('T')[0];</script>
{% endblock %}
